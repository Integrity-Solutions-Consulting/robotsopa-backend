services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection:?Configure ConnectionStrings__DefaultConnection}
      SRI_SHAREPOINT_ENABLED: ${SRI_SHAREPOINT_ENABLED:-false}
      SRI_SHAREPOINT_TENANT_ID: ${SRI_SHAREPOINT_TENANT_ID:-}
      SRI_SHAREPOINT_CLIENT_ID: ${SRI_SHAREPOINT_CLIENT_ID:-}
      SRI_SHAREPOINT_CLIENT_SECRET: ${SRI_SHAREPOINT_CLIENT_SECRET:-}
      SRI_SHAREPOINT_SITE_ID: ${SRI_SHAREPOINT_SITE_ID:-}
      SRI_SHAREPOINT_DRIVE_ID: ${SRI_SHAREPOINT_DRIVE_ID:-}
      SRI_SHAREPOINT_FOLDER: ${SRI_SHAREPOINT_FOLDER:-}
      SRI_OUTPUT_PATH: /app/downloads
      SRI_STATE_PATH: /app/storage
      SRI_SESSION_PATH: /app/sessions
      SRI_CREDENTIAL_PATH: /app/credentials
      SRI_PORTAL_PROFILE: /app/config/sri-portal.json
      SRI_CREDENTIAL_KEY_FILE: /run/secrets/credential-key
      SRI_ADMIN_USERNAME: ${SRI_ADMIN_USERNAME:-}
      SRI_ADMIN_PASSWORD: ${SRI_ADMIN_PASSWORD:-}
      SRI_COOKIE_SECURE: "true"
      SRI_TRUSTED_PROXY_IPS: ${SRI_TRUSTED_PROXY_IPS:-}
      SRI_REMOTE_EXECUTION_ENABLED: ${SRI_REMOTE_EXECUTION_ENABLED:-false}
      ASPNETCORE_ENVIRONMENT: Production
      Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN:?Configure FRONTEND_ORIGIN}
    volumes:
      - state:/app/storage
      - downloads:/app/downloads
      - sessions:/app/sessions
      - credentials:/app/credentials
      - type: bind
        source: ${SRI_CONFIG_DIR:?Configure SRI_CONFIG_DIR}
        target: /app/config
        bind: { create_host_path: false }
      - type: bind
        source: ${SRI_SECRET_DIR}/credential.key
        target: /run/secrets/credential-key
        read_only: true
        bind: { create_host_path: false }
    restart: unless-stopped
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection:?Configure ConnectionStrings__DefaultConnection}
      SRI_SHAREPOINT_ENABLED: ${SRI_SHAREPOINT_ENABLED:-false}
      SRI_SHAREPOINT_TENANT_ID: ${SRI_SHAREPOINT_TENANT_ID:-}
      SRI_SHAREPOINT_CLIENT_ID: ${SRI_SHAREPOINT_CLIENT_ID:-}
      SRI_SHAREPOINT_CLIENT_SECRET: ${SRI_SHAREPOINT_CLIENT_SECRET:-}
      SRI_SHAREPOINT_SITE_ID: ${SRI_SHAREPOINT_SITE_ID:-}
      SRI_SHAREPOINT_DRIVE_ID: ${SRI_SHAREPOINT_DRIVE_ID:-}
      SRI_SHAREPOINT_FOLDER: ${SRI_SHAREPOINT_FOLDER:-}
      SRI_WORKER_PAUSED: ${SRI_WORKER_PAUSED:-true}
      SRI_WORKER_REMOTE_SRI: ${SRI_WORKER_REMOTE_SRI:-true}
      SRI_OUTPUT_PATH: /app/downloads
      SRI_STATE_PATH: /app/storage
      SRI_SESSION_PATH: /app/sessions
      SRI_CREDENTIAL_PATH: /app/credentials
      SRI_CREDENTIAL_KEY_FILE: /run/secrets/credential-key
      SRI_PORTAL_PROFILE: /app/config/sri-portal.json
      SRI_SESSION_KEY_FILE: /run/secrets/session-key
    volumes:
      - state:/app/storage
      - downloads:/app/downloads
      - sessions:/app/sessions
      - credentials:/app/credentials:ro
      - type: bind
        source: ${SRI_SECRET_DIR}/credential.key
        target: /run/secrets/credential-key
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${SRI_CONFIG_DIR:?Configure SRI_CONFIG_DIR}
        target: /app/config
        bind: { create_host_path: false }
      - type: bind
        source: ${SRI_SECRET_DIR:?Configure SRI_SECRET_DIR}/session.key
        target: /run/secrets/session-key
        read_only: true
        bind: { create_host_path: false }
    init: true
    shm_size: 1gb
    restart: unless-stopped
volumes:
  state:
  downloads:
  sessions:
  credentials:

